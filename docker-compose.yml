# Local Airflow (UI on http://localhost:8080) with Spark, for this project.
#   docker compose up --build        start it (first build takes a few minutes)
#   docker compose down              stop it
# The project folder is mounted at /opt/project, so the DAGs read and write
# this folder's Traffic_Violations.csv and data/ directly.
services:
  airflow:
    build: .
    image: tvis-airflow:latest
    command: standalone
    working_dir: /opt/project
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      # Local-only setup: open the UI without a login. Never use this on a shared server.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      TVIS_PROJECT_DIR: /opt/project
      PYTHONPATH: /opt/project
      SPARK_DRIVER_MEMORY: 3g
      # Optional: raises the county API's rate limit. Put it in a .env file next to
      # this one (SODA_APP_TOKEN=...); .env is git-ignored.
      SODA_APP_TOKEN: ${SODA_APP_TOKEN:-}
    volumes:
      - .:/opt/project
      - airflow-home:/opt/airflow

volumes:
  airflow-home:
